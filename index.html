                { key: 'Wiki与百科', name: 'Wiki与百科' },
                { key: '社区/论坛', name: '社区/论坛' },
                { key: '模组/资源站', name: '模组/资源站' },
                { key: '启动器/加载器', name: '启动器/加载器' },
                { key: '材质/光影/皮肤装饰', name: '材质/光影/皮肤装饰' },
                { key: '服务器/技术', name: '服务器/技术' },
                { key: '其他资源', name: '其他资源' }
            ];
            categoryContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.dataset.category = cat.key;
                btn.className = `cat-btn px-4 py-2 rounded-full text-sm font-medium ${cat.key === 'all' ? 'bg-green-600 text-white shadow-sm' : 'bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300'}`;
                btn.textContent = cat.name;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => {
                        b.classList.remove('bg-green-600', 'text-white', 'shadow-sm');
                        b.classList.add('bg-gray-200', 'dark:bg-gray-700', 'text-gray-800', 'dark:text-gray-200');
                    });
                    btn.classList.add('bg-green-600', 'text-white', 'shadow-sm');
                    btn.classList.remove('bg-gray-200', 'dark:bg-gray-700', 'text-gray-800', 'dark:text-gray-200');
                    currentCategory = cat.key;
                    renderCards();
                };
                categoryContainer.appendChild(btn);
            });
        }

        // 构建父标签到子标签的映射
        // 所有未在 tagMapping 中定义的标签都将归入“其他”
        function buildParentToChildren() {
            const parentToChildren = {};
            toolsData.forEach(tool => {
                tool.tags.forEach(tag => {
                    // 关键修改：未映射的标签强制归入“其他”
                    const parent = tagMapping[tag] || '其他';
                    if (!parentToChildren[parent]) {
                        parentToChildren[parent] = new Set();
                    }
                    // 如果原标签不等于父标签，才加入子标签集合（避免父标签下出现自身）
                    if (tag !== parent) {
                        parentToChildren[parent].add(tag);
                    }
                });
            });
            // 将Set转为数组并排序
            for (let parent in parentToChildren) {
                parentToChildren[parent] = Array.from(parentToChildren[parent]).sort();
            }
            return parentToChildren;
        }

        function createTagButton(tag) {
            const btn = document.createElement('button');
            btn.className = `tag-btn px-3 py-1 rounded-full text-xs font-medium ${selectedTags.includes(tag) ? 'bg-green-600 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200'}`;
            btn.dataset.tag = tag;
            btn.textContent = tag;
            btn.onclick = () => toggleTag(tag);
            return btn;
        }

        function renderTags() {
            if (!tagFilters) return;

            const parentToChildren = buildParentToChildren();
            let parents = Object.keys(parentToChildren).sort();
            // 确保“其他”在最后（如果存在）
            if (parents.includes('其他')) {
                parents = parents.filter(p => p !== '其他');
                parents.push('其他');
            }

            tagFilters.innerHTML = '';

            parents.forEach(parent => {
                const children = parentToChildren[parent];
                // 如果父标签下没有子标签（即所有原标签都是自身，被排除），则直接作为普通标签显示
                if (children.length === 0) {
                    const btn = createTagButton(parent);
                    tagFilters.appendChild(btn);
                    return;
                }

                const parentContainer = document.createElement('div');
                parentContainer.className = 'parent-tag-container';

                const parentBtn = document.createElement('button');
                parentBtn.className = `flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600`;
                parentBtn.innerHTML = `<span>${parent}</span> <i class="fas fa-chevron-down transition-transform ${expandedParents.has(parent) ? 'rotate-180' : ''}"></i>`;
                parentBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (expandedParents.has(parent)) {
                        expandedParents.delete(parent);
                    } else {
                        expandedParents.add(parent);
                    }
                    renderTags();
                };
                parentContainer.appendChild(parentBtn);

                const childContainer = document.createElement('div');
                childContainer.className = `flex flex-wrap gap-2 child-tag-container ${expandedParents.has(parent) ? '' : 'hidden'}`;
                children.forEach(childTag => {
                    const childBtn = createTagButton(childTag);
                    childContainer.appendChild(childBtn);
                });
                parentContainer.appendChild(childContainer);

                tagFilters.appendChild(parentContainer);
            });
        }

        function toggleTag(tag) {
            const index = selectedTags.indexOf(tag);
            if (index === -1) selectedTags.push(tag);
            else selectedTags.splice(index, 1);
            renderTags();
            renderCards();
        }

        function renderCards() {
            if (!container) return;
            let filtered = toolsData.filter(tool => {
                if (currentCategory !== 'all' && tool.category !== currentCategory) return false;
                if (selectedTags.length && !selectedTags.every(tag => tool.tags.includes(tag))) return false;
                if (currentSearch) {
                    const lowerSearch = currentSearch.toLowerCase();
                    const match = tool.name.toLowerCase().includes(lowerSearch) || tool.desc.toLowerCase().includes(lowerSearch);
                    if (!match && window.pinyin) {
                        const namePinyin = window.pinyin(tool.name, { toneType: 'none' }).join('');
                        const descPinyin = window.pinyin(tool.desc, { toneType: 'none' }).join('');
                        if (namePinyin.includes(lowerSearch) || descPinyin.includes(lowerSearch)) return true;
                    }
                    return match;
                }
                return true;
            });

            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-gray-500 dark:text-gray-400 text-lg">没有找到匹配的工具 (；′⌒`)</div>';
                return;
            }

            const categories = {};
            filtered.forEach(tool => {
                if (!categories[tool.category]) categories[tool.category] = [];
                categories[tool.category].push(tool);
            });

            const categoryOrder = ['网页版MC', '工具类', 'Wiki与百科', '社区/论坛', '模组/资源站', '启动器/加载器', '材质/光影/皮肤装饰', '服务器/技术', '其他资源'];
            categoryOrder.forEach(cat => {
                if (categories[cat]) {
                    const details = document.createElement('details');
                    details.className = 'category-group';
                    details.open = true;
                    details.innerHTML = `
                        <summary class="category-summary">
                            <span>${cat} (${categories[cat].length})</span>
                            <i class="fas fa-chevron-down transition-transform"></i>
                        </summary>
                        <div class="category-content"></div>
                    `;
                    container.appendChild(details);
                    const contentDiv = details.querySelector('.category-content');
                    categories[cat].forEach(tool => {
                        const card = createCard(tool);
                        contentDiv.appendChild(card);
                    });
                }
            });
        }

        function createCard(tool) {
            const card = document.createElement('div');
            card.className = 'card bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-100 dark:border-gray-700 flex flex-col cursor-pointer';
            card.onclick = () => window.open(tool.url, '_blank');

            const statusText = tool.status === 'normal' ? '正常' : (tool.warningText || '注意');
            const isFavorite = favoriteIds.includes(tool.name);
            const isCompare = compareList.includes(tool.name);

            card.innerHTML = `
                <div class="p-4 flex-1">
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">${tool.name}</h3>
                        <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium ${tool.status === 'normal' ? 'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200' : 'bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200'}">${statusText}</span>
                    </div>
                    <p class="text-gray-600 dark:text-gray-300 text-sm mb-3">${tool.desc}</p>
                    <div class="flex flex-wrap gap-1 mb-3">
                        ${tool.tags.map(tag => `<span class="px-2 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-full text-xs">${tag}</span>`).join('')}
                    </div>
                    <div class="mt-auto flex items-center justify-between" onclick="event.stopPropagation()">
                        <div class="flex items-center gap-2">
                            <a href="${tool.url}" target="_blank" rel="noopener noreferrer" class="visit-link text-green-600 dark:text-green-400 hover:text-green-800 dark:hover:text-green-300 font-medium text-sm" data-url="${tool.url}" onclick="event.stopPropagation()">访问网站</a>
                            <button onclick="showDetail('${tool.name}'); event.stopPropagation()" class="text-blue-500 hover:text-blue-700 text-sm"><i class="far fa-eye"></i></button>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleFavorite('${tool.name}'); event.stopPropagation()" class="text-yellow-500 hover:text-yellow-600" title="收藏">
                                <i class="${isFavorite ? 'fas' : 'far'} fa-star"></i>
                            </button>
                            <button onclick="toggleCompare('${tool.name}'); event.stopPropagation()" class="text-gray-400 hover:text-gray-600" title="对比">
                                <i class="${isCompare ? 'fas fa-check-square' : 'far fa-square'}"></i>
                            </button>
                            <button onclick="copyToClipboard('${tool.url}'); event.stopPropagation()" class="text-gray-400 hover:text-gray-600" title="复制链接">
                                <i class="far fa-copy"></i>
                            </button>
                            <button onclick="openFeedbackModal('${tool.name}'); event.stopPropagation()" class="text-gray-400 hover:text-gray-600 feedback-btn" title="反馈问题">
                                <i class="fas fa-pencil-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function openFeedbackModal(toolName) {
            if (feedbackModal && feedbackToolName && feedbackToolNameDisplay) {
                feedbackToolName.value = toolName;
                feedbackToolNameDisplay.textContent = toolName;
                feedbackModal.classList.add('show');
            }
        }
        window.closeFeedbackModal = () => {
            if (feedbackModal) feedbackModal.classList.remove('show');
        };

        function copyToClipboard(text) {
            if (!copyToast) return;
            navigator.clipboard.writeText(text).then(() => {
                copyToast.textContent = '✅ 链接已复制';
                copyToast.classList.add('show');
                setTimeout(() => copyToast.classList.remove('show'), 2000);
            }).catch(() => alert('复制失败，请手动复制 (；一_一)'));
        }

        function showDetail(name) {
            const tool = toolsData.find(t => t.name === name);
            if (tool && modal && modalTitle && modalDesc && modalDetail && modalLink) {
                modalTitle.textContent = tool.name;
                modalDesc.textContent = tool.desc;
                modalDetail.textContent = tool.detail || '暂无详细介绍';
                modalLink.href = tool.url;
                modal.classList.add('show');
            }
        }
        window.closeModal = () => {
            if (modal) modal.classList.remove('show');
        };

        function toggleFavorite(name) {
            const index = favoriteIds.indexOf(name);
            if (index === -1) favoriteIds.push(name);
            else favoriteIds.splice(index, 1);
            localStorage.setItem('favorites', JSON.stringify(favoriteIds));
            renderCards();
        }

        function toggleCompare(name) {
            const index = compareList.indexOf(name);
            if (index === -1) compareList.push(name);
            else compareList.splice(index, 1);
            localStorage.setItem('compareList', JSON.stringify(compareList));
            updateCompareBar();
            renderCards();
        }

        function updateCompareBar() {
            if (!compareCount || !compareBtn || !compareBar) return;
            compareCount.textContent = compareList.length;
            if (compareList.length >= 2) compareBtn.disabled = false;
            else compareBtn.disabled = true;
            if (compareList.length > 0) compareBar.classList.remove('translate-y-full');
            else compareBar.classList.add('translate-y-full');
        }

        if (clearCompare) {
            clearCompare.addEventListener('click', () => {
                compareList = [];
                localStorage.setItem('compareList', JSON.stringify(compareList));
                updateCompareBar();
                renderCards();
            });
        }

        if (compareBtn) {
            compareBtn.addEventListener('click', () => {
                if (compareList.length < 2) return;
                const tools = toolsData.filter(t => compareList.includes(t.name));
                let msg = '对比工具：\n';
                tools.forEach(t => msg += `${t.name}: ${t.url}\n`);
                alert(msg);
            });
        }

        if (randomBtn) {
            randomBtn.addEventListener('click', () => {
                const filtered = toolsData.filter(t => {
                    if (currentCategory !== 'all' && t.category !== currentCategory) return false;
                    if (selectedTags.length && !selectedTags.every(tag => t.tags.includes(tag))) return false;
                    return true;
                });
                if (filtered.length === 0) return;
                const random = filtered[Math.floor(Math.random() * filtered.length)];
                window.open(random.url, '_blank');
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput && searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape' && searchInput) {
                searchInput.value = '';
                currentSearch = '';
                renderCards();
            }
        });

        function initCharts() {
            const catCanvas = document.getElementById('categoryChart');
            const statusCanvas = document.getElementById('statusChart');
            if (!catCanvas || !statusCanvas) return;
            const catCtx = catCanvas.getContext('2d');
            const statusCtx = statusCanvas.getContext('2d');
            const catCount = {};
            const statusCount = { normal: 0, warning: 0 };
            toolsData.forEach(t => {
                catCount[t.category] = (catCount[t.category] || 0) + 1;
                statusCount[t.status] = (statusCount[t.status] || 0) + 1;
            });

            catChart = new Chart(catCtx, {
                type: 'pie',
                data: {
                    labels: Object.keys(catCount),
                    datasets: [{ data: Object.values(catCount), backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899'] }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { labels: { color: document.documentElement.classList.contains('dark') ? '#fff' : '#333' } }
                    }
                }
            });

            statusChart = new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['正常', '注意'],
                    datasets: [{ data: [statusCount.normal, statusCount.warning], backgroundColor: ['#10b981', '#f59e0b'] }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { labels: { color: document.documentElement.classList.contains('dark') ? '#fff' : '#333' } }
                    }
                }
            });
        }

        if (darkModeToggle && darkIcon) {
            darkModeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                if (document.documentElement.classList.contains('dark')) {
                    darkIcon.classList.remove('fa-moon');
                    darkIcon.classList.add('fa-sun');
                    localStorage.setItem('theme', 'dark');
                } else {
                    darkIcon.classList.remove('fa-sun');
                    darkIcon.classList.add('fa-moon');
                    localStorage.setItem('theme', 'light');
                }
                if (catChart && statusChart) {
                    catChart.options.plugins.legend.labels.color = document.documentElement.classList.contains('dark') ? '#fff' : '#333';
                    statusChart.options.plugins.legend.labels.color = document.documentElement.classList.contains('dark') ? '#fff' : '#333';
                    catChart.update();
                    statusChart.update();
                }
            });
        }

        function loadTheme() {
            if (localStorage.getItem('theme') === 'dark' && darkIcon) {
                document.documentElement.classList.add('dark');
                darkIcon.classList.remove('fa-moon');
                darkIcon.classList.add('fa-sun');
            }
        }

        if (favoriteBtn) {
            favoriteBtn.addEventListener('click', () => {
                if (currentCategory === 'favorite') {
                    currentCategory = 'all';
                    favoriteBtn.classList.remove('bg-yellow-500', 'text-white');
                } else {
                    currentCategory = 'favorite';
                    favoriteBtn.classList.add('bg-yellow-500', 'text-white');
                }
                renderCards();
            });
        }

        if (submitLink && submitModal) {
            submitLink.addEventListener('click', (e) => {
                e.preventDefault();
                submitModal.classList.add('show');
            });
        }
        window.closeSubmitModal = () => {
            if (submitModal) submitModal.classList.remove('show');
        };

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300 && backToTop) {
                backToTop.classList.add('opacity-100', 'visible');
            } else if (backToTop) {
                backToTop.classList.remove('opacity-100', 'visible');
            }
        });
        if (backToTop) {
            backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value.trim();
                renderCards();
            });
        }

        loadToolsData();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW注册失败，不过没关系～', err));
        }
    </script>
</body>
</html>
