<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Minecraft 工具</title>
    <!-- Tailwind CSS (◕‿◕) 快速搭架子 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 图标库 ヾ(≧▽≦*)o -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Chart.js 画小饼饼 (～￣▽￣)～ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- pinyin-pro 拼音搜索 -->
    <script src="https://unpkg.com/pinyin-pro@3.18.3/dist/index.js"></script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="theme-color" content="#10b981">
    <style>
        /* 补充暗色模式卡片样式（防止 Tailwind 覆盖） */
        .dark .card {
            background-color: #1f2937 !important;
            border-color: #374151 !important;
            color: #e5e7eb !important;
        }
        .dark .card .text-gray-600,
        .dark .card .text-gray-700,
        .dark .card .text-gray-800,
        .dark .card .text-gray-900 {
            color: #d1d5db !important;
        }
        .dark .card .bg-gray-100 {
            background-color: #374151 !important;
            color: #e5e7eb !important;
        }
        .dark .card .visit-link {
            color: #34d399 !important;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased transition-colors duration-300 dark:bg-gray-900 relative">

    <!-- 复制成功小浮层 (￣▽￣)~* -->
    <div id="copyToast" class="copy-toast">✅ 链接已复制</div>
    <button id="backToTop" class="fixed bottom-6 right-6 p-3 rounded-full bg-green-600 text-white shadow-lg hover:bg-green-700 transition opacity-0 invisible z-50"><i class="fas fa-arrow-up"></i></button>

    <!-- 详情模态框 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold"></h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300"><i class="fas fa-times"></i></button>
            </div>
            <p id="modalDesc" class="text-gray-600 dark:text-gray-300 mb-4"></p>
            <p id="modalDetail" class="text-sm text-gray-500 dark:text-gray-400"></p>
            <div class="mt-6 flex justify-end">
                <a id="modalLink" href="#" target="_blank" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">访问网站</a>
            </div>
        </div>
    </div>

    <!-- 对比栏 -->
    <div id="compareBar" class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 shadow-lg border-t dark:border-gray-700 p-3 transform translate-y-full transition-transform z-40">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <span class="text-sm font-medium"><span id="compareCount">0</span> <span id="compareText">个工具已选择</span></span>
            <div>
                <button id="compareBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled><span id="compareBtnText">对比</span></button>
                <button id="clearCompare" class="ml-2 text-gray-500 text-sm hover:underline"><span id="clearCompareText">清空</span></button>
            </div>
        </div>
    </div>

    <!-- 提交新工具表单 -->
    <div id="submitModal" class="modal">
        <div class="modal-content">
            <h3 id="submitTitle" class="text-xl font-bold mb-4">提交新工具</h3>
            <form id="submitForm" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="bc43e518-f1ff-41e0-b1a3-549259c4ca62">
                <input type="hidden" name="subject" value="新工具提交 - Minecraft工具">
                <input type="text" name="name" id="submitName" placeholder="工具名称" class="w-full p-2 border rounded mb-2 dark:bg-gray-700 dark:border-gray-600" required>
                <input type="url" name="url" id="submitUrl" placeholder="网址" class="w-full p-2 border rounded mb-2 dark:bg-gray-700 dark:border-gray-600" required>
                <textarea name="desc" id="submitDesc" placeholder="简短描述" class="w-full p-2 border rounded mb-2 dark:bg-gray-700 dark:border-gray-600" required></textarea>
                <select name="category" id="submitCategory" class="w-full p-2 border rounded mb-4 dark:bg-gray-700 dark:border-gray-600">
                    <option value="工具类">工具类</option>
                    <option value="资源搜寻">资源搜寻</option>
                    <option value="其他资源">其他资源</option>
                </select>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeSubmitModal()" id="cancelBtn" class="px-4 py-2 bg-gray-300 rounded">取消</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 bg-green-600 text-white rounded">提交</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 反馈问题表单 -->
    <div id="feedbackModal" class="modal">
        <div class="modal-content">
            <h3 id="feedbackTitle" class="text-xl font-bold mb-4">反馈工具问题</h3>
            <p id="feedbackHope" class="mb-4 text-sm text-gray-500 dark:text-gray-400">希望不要用到 awq</p>
            <form id="feedbackForm" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="bc43e518-f1ff-41e0-b1a3-549259c4ca62">
                <input type="hidden" name="subject" value="工具反馈 - Minecraft工具">
                <input type="hidden" name="tool_name" id="feedbackToolName">
                <p class="mb-2 text-sm text-gray-600 dark:text-gray-400">工具：<span id="feedbackToolNameDisplay"></span></p>
                <textarea name="message" id="feedbackMessage" placeholder="请描述您发现的错误或建议（如链接失效、描述错误等）" class="w-full p-2 border rounded mb-2 dark:bg-gray-700 dark:border-gray-600" rows="4" required></textarea>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeFeedbackModal()" id="feedbackCancelBtn" class="px-4 py-2 bg-gray-300 rounded">取消</button>
                    <button type="submit" id="feedbackSubmitBtn" class="px-4 py-2 bg-green-600 text-white rounded">提交反馈</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 主容器 (✪ω✪) -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-20">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <h1 id="siteTitleMain" class="text-4xl font-bold text-gray-900 dark:text-white">Minecraft 工具</h1>
            <div class="flex flex-wrap items-center gap-3">
                <button id="randomBtn" class="px-3 py-2 bg-purple-100 dark:bg-purple-900 text-purple-700 dark:text-purple-200 rounded-lg text-sm hover:bg-purple-200"><i class="fas fa-dice"></i> <span id="randomText">随机探索</span></button>
                <select id="langSelect" class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg text-sm p-2">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                    <option value="ru">Русский</option>
                    <option value="es">Español</option>
                </select>
                <button id="darkModeToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-yellow-300 hover:bg-gray-300 dark:hover:bg-gray-600 transition" title="切换暗色模式">
                    <i id="darkIcon" class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <div id="shortcutHint" class="text-xs text-gray-400 mb-2 text-right">快捷键: <kbd class="bg-gray-200 dark:bg-gray-700 px-1 rounded">/</kbd> 搜索 · <kbd class="bg-gray-200 dark:bg-gray-700 px-1 rounded">ESC</kbd> 清空</div>

        <div class="flex flex-col gap-4 mb-4">
            <div class="relative flex-1 min-w-0 w-full">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search" placeholder="搜索工具名称或描述 (支持拼音)" 
                       class="w-full pl-10 pr-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-white rounded-xl shadow-sm focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition">
            </div>
            <div class="flex flex-wrap gap-2 items-center flex-shrink-0">
                <div id="categoryButtons" class="flex flex-wrap gap-2 items-center">
                    <!-- 分类按钮由JS生成 -->
                </div>
                <button id="favoriteBtn" class="px-3 py-2 rounded-full text-sm bg-yellow-100 dark:bg-yellow-900 text-yellow-700 dark:text-yellow-200 flex-shrink-0"><i class="far fa-star"></i> <span id="favoriteBtnText">收藏</span></button>
            </div>
        </div>

        <!-- 标签筛选容器 -->
        <div id="tagFilters" class="flex flex-col gap-3 mb-4"></div>

        <details class="mb-6 bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm">
            <summary id="statsSummary" class="font-medium cursor-pointer">📊 工具统计 (点击展开)</summary>
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <canvas id="categoryChart" class="w-full h-auto"></canvas>
                <canvas id="statusChart" class="w-full h-auto"></canvas>
            </div>
        </details>

        <div id="tools-container" class="space-y-4"></div>

        <footer class="mt-12 text-center text-sm text-gray-500 dark:text-gray-400 border-t dark:border-gray-700 pt-6">
            <p>
                <span id="footerUpdate">最后更新：2026年</span> · 
                <span id="footerOfficial">所有链接均指向官方网站</span> · 
                <a href="#" id="submitLink" class="text-green-600 hover:underline"><span id="submitLinkText">提交新工具</span></a> · 
                <a href="mailto:gt0507-001@qq.com?subject=失效报告-Minecraft工具" id="reportLink" class="text-red-500 hover:underline" target="_blank"><span id="reportLinkText">报告失效</span></a>
            </p>
            <div class="mt-4 flex items-center justify-center gap-2 text-xs">
                <a href="https://github.com/lingxiaoGT/lingxiaoGT.github.io" target="_blank" rel="noopener noreferrer" class="text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200">
                    <i class="fab fa-github fa-2x"></i>
                </a>
                <span id="thanksText">鸣谢 GitHub 提供免费托管服务 (●'◡'●)</span>
            </div>
            <p id="footerFeatures" class="mt-2">⚡ 全功能版 · 支持收藏/对比/拼音搜索/快捷键/统计图表/暗色模式</p>
        </footer>
    </div>

    <!-- 评论区域 (Giscus) -->
    <div class="max-w-7xl mx-auto px-4 mt-8">
        <div class="bg-white dark:bg-gray-800 rounded-xl p-4">
            <h3 id="commentsTitle" class="text-lg font-medium mb-2">💬 社区讨论</h3>
            <div id="giscus-placeholder" class="text-gray-500 text-sm">评论功能在本地不可用，请部署后访问。</div>
            <script>
                (function() {
                    if (window.location.protocol !== 'file:') {
                        document.getElementById('giscus-placeholder').style.display = 'none';
                        const script = document.createElement('script');
                        script.src = 'https://giscus.app/client.js';
                        script.setAttribute('data-repo', 'lingxiaoGT/lingxiaoGT.github.io');
                        script.setAttribute('data-repo-id', 'R_kgDORZ0u1Q');
                        script.setAttribute('data-category', 'Announcements');
                        script.setAttribute('data-category-id', 'DIC_kwDORZ0u1c4C3STR');
                        script.setAttribute('data-mapping', 'pathname');
                        script.setAttribute('data-strict', '0');
                        script.setAttribute('data-reactions-enabled', '1');
                        script.setAttribute('data-emit-metadata', '0');
                        script.setAttribute('data-input-position', 'bottom');
                        script.setAttribute('data-theme', 'preferred_color_scheme');
                        script.setAttribute('data-lang', 'zh-CN');
                        script.setAttribute('crossorigin', 'anonymous');
                        script.async = true;
                        document.getElementById('giscus-placeholder').parentNode.appendChild(script);
                    }
                })();
            </script>
        </div>
    </div>

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
